name: Android release check

# Opens an already published APK on Android. Runs by hand and never publishes anything.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as android-v1.0.0
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the APK
        run: gh release download "${{ inputs.tag }}" --pattern '*.apk' --dir published
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-boot-anim -camera-back none
          script: node android/test/release-smoke.mjs published/*.apk
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-check
          path: android/test/out
