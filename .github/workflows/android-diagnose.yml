name: Android diagnose

on:
  push:
    branches: ['fix/android-start']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build both ways
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          node scripts/build-android.mjs --debug
          cp release/T-Music-Android-debug.apk /tmp/linux-debug.apk
          node scripts/build-android.mjs
          cp release/T-Music-Android-1.0.0.apk /tmp/linux-release.apk
      - name: Get the published APK
        run: gh release download android-v1.0.0 --pattern '*.apk' --dir /tmp/published --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-boot-anim -camera-back none
          script: node android/test/diagnose.mjs '[["published","/tmp/published/T-Music-Android-1.0.0.apk"],["linux-release","/tmp/linux-release.apk"],["linux-debug","/tmp/linux-debug.apk"]]'
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnose
          path: android/test/out
