name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to attach APK to (e.g. v0.3.9)'
        required: false
        default: 'v0.3.9'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Locate & Package APK
        id: package_apk
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="0.3.9"
          fi
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: No APK generated!"
            exit 1
          fi
          TARGET_APK="T-Music-${VERSION}.apk"
          cp "$APK_PATH" "$TARGET_APK"
          echo "Built APK: $TARGET_APK from $APK_PATH"
          echo "apk_file=$TARGET_APK" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=${RAW_TAG}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_apk.outputs.apk_file }}
          path: ${{ steps.package_apk.outputs.apk_file }}

      - name: Upload APK to GitHub Release
        run: |
          TAG="${{ steps.package_apk.outputs.tag_name }}"
          APK="${{ steps.package_apk.outputs.apk_file }}"
          echo "Uploading $APK to release $TAG..."
          gh release upload "$TAG" "$APK" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
